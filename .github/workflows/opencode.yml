name: OpenCode Action

on:
  workflow_dispatch:
    inputs:
      custom_prompt:
        description: 'Enter task for OpenCode (e.g., Update app version or fix login button style)'
        required: true
        type: string
      branch_name:
        description: 'Name for the branch to create/use'
        required: true
        default: 'feature/opencode-patch'
        type: string

jobs:
  opencode-task:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create and Switch to Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ inputs.branch_name }}

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: ${{ inputs.custom_prompt }}

      - name: Commit and Push Changes
        run: |
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "automation(opencode): ${{ inputs.custom_prompt }}"
            git push origin ${{ inputs.branch_name }} --force
          else
            echo "No changes made by OpenCode."
          fi
